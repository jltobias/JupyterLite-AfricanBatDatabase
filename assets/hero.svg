    <path d="M588 144 645 141 688 157 727 151 779 161 817 146"/>
    <path d="M605 177 646 178 688 194 731 189 769 202 811 191 851 182"/>
    <path d="M626 209 670 215 709 229 750 221 789 235 834 224 891 213"/>
    <path d="M654 239 694 247 733 260 777 253 819 269 864 251 919 244"/>
    <path d="M685 273 723 282 762 294 803 287 845 301 891 282 936 278"/>
    <path d="M718 314 750 324 786 338 825 329 861 343 915 317"/>
  </g>
  <g fill="#f3cf72" stroke="#10252a" stroke-width="3">
    <circle cx="654" cy="207" r="5"/><circle cx="719" cy="244" r="5"/>
    <circle cx="763" cy="188" r="5"/><circle cx="793" cy="318" r="5"/>
    <circle cx="686" cy="303" r="5"/><circle cx="825" cy="231" r="5"/>
    <circle cx="740" cy="358" r="5"/><circle cx="882" cy="322" r="5"/>
  </g>
