    <circle cx="85" cy="450" r="6" fill="#f3cf72"/>
    <text x="103" y="455" fill="#e4e6d9" font-size="13">Bat occurrence record</text>
    <circle cx="85" cy="481" r="10" fill="none" stroke="#d9b96c" stroke-opacity=".8"/>
    <circle cx="85" cy="481" r="16" fill="none" stroke="#d9b96c" stroke-opacity=".42"/>
    <text x="111" y="486" fill="#e4e6d9" font-size="13">Distance rings (schematic)</text>
    <text x="850" y="64" fill="#e9d8a4" font-size="12" font-weight="700" letter-spacing="2">50 KM CONTEXT</text>
    <text x="850" y="505" fill="#a9beb0" font-size="11" text-anchor="middle" letter-spacing="1.2">SCHEMATIC — NOT A DATA MAP</text>
