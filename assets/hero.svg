  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="130" fill="#f4e8cc" font-size="15" font-weight="700" letter-spacing="3">FIELD NOTES · AFRICA</text>
    <text x="76" y="197" fill="#fff8e9" font-size="43" font-weight="700">Bats &amp; Mining</text>
    <text x="77" y="235" fill="#d9e3d3" font-size="18">A mine-by-mine spatial story</text>
    <text x="77" y="281" fill="#b9c9b8" font-size="14">Tracing documented bat records near</text>
    <text x="77" y="304" fill="#b9c9b8" font-size="14">mineral facilities — not inferring impact.</text>
    <text x="77" y="390" fill="#e1c77f" font-size="12" font-weight="700" letter-spacing="1.5">FACILITY DISTANCE</text>
    <circle cx="85" cy="420" r="7" fill="#ec855d"/>
