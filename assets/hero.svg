<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">African Bats and Mining storymap</title>
  <desc id="description">A dark map-inspired illustration with an outline of Africa, distance rings around a mineral facility, and bat observation points.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10252a"/>
      <stop offset="1" stop-color="#183a38"/>
    </linearGradient>
    <linearGradient id="continent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244a43"/>
      <stop offset="1" stop-color="#193b38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7c8b0" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="22" fill="url(#background)"/>
  <rect width="1280" height="520" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="#d9b96c" stroke-opacity=".32">
