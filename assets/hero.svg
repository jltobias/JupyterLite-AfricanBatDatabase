  </g>
  <path d="M585 79 626 69 659 83 685 78 714 94 739 98 755 116 779 120 789 138 817 146 838 164 851 182 879 190 891 213 914 223 919 244 942 257 936 278 921 290 915 317 896 331 890 351 870 362 861 386 843 400 836 427 819 448 800 453 785 439 781 414 765 392 761 367 743 351 734 327 718 314 699 293 685 273 668 257 654 239 637 230 626 209 611 197 605 177 592 165 588 144 575 127 579 108Z" fill="url(#continent)" stroke="#aac4a1" stroke-opacity=".65" stroke-width="2"/>
  <path d="M584 80 558 68 538 74 525 91 538 105 558 101 578 109M838 164 862 151 884 154 900 168 891 185 879 190" fill="none" stroke="#aac4a1" stroke-opacity=".55" stroke-width="2"/>
